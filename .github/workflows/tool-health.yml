name: Nisulka Tool Health

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tool architecture
        run: python3 scripts/validate_tools.py

      - name: Publish health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nisulka-tool-health
          path: reports/
          if-no-files-found: ignore

      - name: Add summary
        if: always()
        run: |
          if [ -f reports/tool-health.md ]; then
            cat reports/tool-health.md >> "$GITHUB_STEP_SUMMARY"
          fi
