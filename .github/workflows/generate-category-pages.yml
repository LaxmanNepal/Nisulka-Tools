name: Generate Category Pages

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "data/tools.json"
      - ".github/workflows/generate-category-pages.yml"

permissions:
  contents: write

jobs:
  generate-category-pages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate category pages
        shell: bash
        run: |
          python3 <<'PY'
          import json
          import os
          import re
          from html import escape

          DATA_FILE = "data/tools.json"
          OUTPUT_DIR = "categories"

          print("======================================")
          print("NISULKA TOOLS CATEGORY GENERATOR")
          print("======================================")

          if not os.path.isfile(DATA_FILE):
              raise SystemExit(
                  "ERROR: data/tools.json does not exist."
              )

          with open(DATA_FILE, "r", encoding="utf-8") as f:
              tools = json.load(f)

          if not isinstance(tools, list):
              raise SystemExit(
                  "ERROR: data/tools.json must contain an array."
              )

          categories = {}

          for tool in tools:
              if not isinstance(tool, dict):
                  continue

              if tool.get("status") == "hidden":
                  continue

              category = str(
                  tool.get("category") or "Other Tools"
              ).strip()

              categories.setdefault(category, []).append(tool)

          os.makedirs(OUTPUT_DIR, exist_ok=True)

          def slugify(value):
              value = value.lower()
              value = re.sub(r"[^a-z0-9]+", "-", value)
              return value.strip("-")

          generated = 0

          for category, category_tools in sorted(categories.items()):

              slug = slugify(category)

              if not slug:
                  slug = "other-tools"

              directory = os.path.join(
                  OUTPUT_DIR,
                  slug
              )

              os.makedirs(directory, exist_ok=True)

              cards = []

              for tool in category_tools:

                  name = escape(
                      str(
                          tool.get(
                              "name",
                              "Unnamed Tool"
                          )
                      )
                  )

                  description = escape(
                      str(
                          tool.get(
                              "description",
                              "Useful online tool."
                          )
                      )
                  )

                  url = escape(
                      str(
                          tool.get(
                              "url",
                              "#"
                          )
                      ),
                      quote=True
                  )

                  logo = str(
                      tool.get(
                          "logo",
                          ""
                      )
                  )

                  if logo:
                      logo_html = f'''
                      <img
                          src="{escape(logo, quote=True)}"
                          alt=""
                          loading="lazy"
                      >
                      '''
                  else:
                      logo_html = '''
                      <div class="category-tool-fallback">
                          🛠️
                      </div>
                      '''

                  cards.append(f'''
          <article class="category-tool-card">

              <a
                  href="{url}"
                  class="category-tool-link"
              >

                  <div class="category-tool-logo">
                      {logo_html}
                  </div>

                  <div class="category-tool-content">

                      <h2>
                          {name}
                      </h2>

                      <p>
                          {description}
                      </p>

                  </div>

              </a>

          </article>
          ''')

              title = (
                  f"{category} — Free Online Tools | "
                  f"Nisulka Tools"
              )

              description = (
                  f"Explore free {category.lower()} "
                  f"tools on Nisulka Tools. "
                  f"Fast, simple and easy-to-use "
                  f"online utilities."
              )

              canonical = (
                  "https://apps.laxmannepal.com.np/"
                  f"Nisulka-Tools/categories/{slug}/"
              )

              page = f'''<!DOCTYPE html>
          <html lang="en">

          <head>

              <meta charset="UTF-8">

              <meta
                  name="viewport"
                  content="width=device-width, initial-scale=1.0"
              >

              <title>{escape(title)}</title>

              <meta
                  name="description"
                  content="{escape(description)}"
              >

              <meta
                  name="robots"
                  content="index, follow"
              >

              <link
                  rel="canonical"
                  href="{canonical}"
              >

              <meta
                  name="theme-color"
                  content="#2563eb"
              >

              <link
                  rel="stylesheet"
                  href="../../assets/css/variables.css"
              >

              <link
                  rel="stylesheet"
                  href="../../assets/css/global.css"
              >

              <link
                  rel="stylesheet"
                  href="../../assets/css/components.css"
              >

              <link
                  rel="stylesheet"
                  href="../../assets/css/header.css"
              >

              <link
                  rel="stylesheet"
                  href="../../assets/css/footer.css"
              >

              <link
                  rel="stylesheet"
                  href="../../assets/css/category.css"
              >

          </head>

          <body>

              <div id="site-header-mount"></div>

              <main class="category-page">

                  <section class="category-hero">

                      <div class="container">

                          <nav
                              class="breadcrumb"
                              aria-label="Breadcrumb"
                          >

                              <a href="../../">
                                  Home
                              </a>

                              <span aria-hidden="true">
                                  /
                              </span>

                              <span>
                                  {escape(category)}
                              </span>

                          </nav>

                          <span class="badge badge-primary">
                              Nisulka Tools
                          </span>

                          <h1>
                              {escape(category)}
                          </h1>

                          <p>
                              Explore
                              {len(category_tools)}
                              free online tools in this category.
                          </p>

                      </div>

                  </section>

                  <section class="section">

                      <div class="container">

                          <div class="category-tools-grid">

                              {"".join(cards)}

                          </div>

                      </div>

                  </section>

              </main>

              <div id="site-footer-mount"></div>

              <script src="../../assets/js/header.js"></script>
              <script src="../../assets/js/footer.js"></script>
              <script src="../../assets/js/category.js"></script>

          </body>

          </html>
          '''

              output_file = os.path.join(
                  directory,
                  "index.html"
              )

              with open(
                  output_file,
                  "w",
                  encoding="utf-8"
              ) as f:
                  f.write(page)

              generated += 1

              print(
                  f"Generated: {category} "
                  f"-> categories/{slug}/index.html"
              )

          print()
          print(
              f"Generated {generated} category pages."
          )
          print("Done.")

          PY

      - name: Show generated files
        run: |
          echo "======================================"
          echo "GENERATED CATEGORY PAGES"
          echo "======================================"

          find categories \
            -maxdepth 2 \
            -type f \
            -name "index.html" \
            -print

      - name: Commit generated pages
        shell: bash
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add categories/

          if git diff --cached --quiet; then
              echo "No category page changes."
              exit 0
          fi

          git commit \
            -m "chore: update category pages"

          git push
