name: Generate Category Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/tools.json"
      - ".github/workflows/generate-category-pages.yml"
permissions:
  contents: write
concurrency:
  group: nisulka-category-generation
  cancel-in-progress: false
jobs:
  generate-category-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Generate category pages
        run: python3 scripts/generate-category-pages.py
      - name: Validate generated category pages
        run: python3 scripts/validate_tools.py
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add categories/
          if git diff --cached --quiet; then echo "No category page changes."; exit 0; fi
          git commit -m "chore: update category pages"
          git push
