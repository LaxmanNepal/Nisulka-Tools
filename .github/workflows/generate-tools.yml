name: Generate Tools Data

on:
  push:
    branches:
      - main
    paths:
      - "tools/**"
      - ".github/workflows/generate-tools.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-tools:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate tools.json
        run: |
          python3 <<'PY'
          import os
          import json
          import re

          TOOLS_DIR = "tools"
          OUTPUT_FILE = "data/tools.json"

          tools = []

          if not os.path.isdir(TOOLS_DIR):
              print("No tools directory found.")
              raise SystemExit(0)

          for slug in sorted(os.listdir(TOOLS_DIR)):

              tool_dir = os.path.join(TOOLS_DIR, slug)

              if not os.path.isdir(tool_dir):
                  continue

              index_file = os.path.join(tool_dir, "index.html")
              logo_file = os.path.join(tool_dir, "logo.jpg")

              if not os.path.isfile(index_file):
                  print(f"Skipping {slug}: index.html not found")
                  continue

              if not os.path.isfile(logo_file):
                  print(f"Skipping {slug}: logo.jpg not found")
                  continue

              with open(index_file, "r", encoding="utf-8") as f:
                  html = f.read()

              def get_meta(name):

                  patterns = [
                      rf'<meta\s+name=["\']{re.escape(name)}["\']\s+content=["\'](.*?)["\']',
                      rf'<meta\s+content=["\'](.*?)["\']\s+name=["\']{re.escape(name)}["\']'
                  ]

                  for pattern in patterns:

                      match = re.search(
                          pattern,
                          html,
                          re.IGNORECASE | re.DOTALL
                      )

                      if match:
                          return match.group(1).strip()

                  return ""

              name = get_meta("tool:name")
              description = get_meta("tool:description")
              category = get_meta("tool:category")
              featured = get_meta("tool:featured").lower()
              keywords = get_meta("tool:keywords")
              status = get_meta("tool:status").lower()

              if not status:
                  status = "active"

              if status == "hidden":
                  print(f"Skipping hidden tool: {slug}")
                  continue

              if not name:
                  name = slug.replace("-", " ").title()

              if not description:
                  description = f"Free online {name} tool."

              if not category:
                  category = "Other Tools"

              featured_value = featured in [
                  "true",
                  "1",
                  "yes"
              ]

              keyword_list = []

              if keywords:
                  keyword_list = [
                      keyword.strip()
                      for keyword in keywords.split(",")
                      if keyword.strip()
                  ]

              tool = {
                  "name": name,
                  "slug": slug,
                  "description": description,
                  "category": category,
                  "logo": f"/Nisulka-Tools/tools/{slug}/logo.jpg",
                  "url": f"/Nisulka-Tools/tools/{slug}/",
                  "keywords": keyword_list,
                  "featured": featured_value,
                  "status": status
              }

              tools.append(tool)

              print(f"Added: {name}")

          os.makedirs("data", exist_ok=True)

          with open(
              OUTPUT_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  tools,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

              f.write("\n")

          print()
          print(f"Generated {OUTPUT_FILE}")
          print(f"Total tools: {len(tools)}")
          PY

      - name: Commit generated tools.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/tools.json

          if git diff --cached --quiet; then
            echo "No changes to tools.json"
          else
            git commit -m "chore: update tools.json"
            git push
          fi
