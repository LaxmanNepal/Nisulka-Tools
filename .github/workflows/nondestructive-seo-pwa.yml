name: Nisulka SEO + PWA Quality
on:
  push:
    branches: [main]
    paths: ['data/tools.json','scripts/**','index.html','manifest.webmanifest','robots.txt','sitemap.xml','sw.js']
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate-and-sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate tool catalogue
        run: python3 scripts/validate-tools.py
      - name: Generate sitemap
        run: python3 scripts/generate-sitemap.py
      - name: Commit generated sitemap
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- sitemap.xml; then
            echo 'Sitemap already current.'
          else
            git add sitemap.xml
            git commit -m 'chore: refresh Nisulka sitemap'
            git push
          fi
