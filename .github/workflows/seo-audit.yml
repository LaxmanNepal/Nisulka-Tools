name: Nisulka Tools SEO Audit

on:

  push:
    branches:
      - main

    paths:
      - "tools/**"
      - "seo/**"
      - ".github/workflows/seo-audit.yml"

  workflow_dispatch:

  schedule:
    - cron: "30 2 * * 1"


permissions:
  contents: write


jobs:

  seo-audit:

    runs-on: ubuntu-latest

    steps:


      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =====================================================
      # PYTHON
      # =====================================================

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      # =====================================================
      # SHOW FILES
      # =====================================================

      - name: Check repository
        run: |

          echo "======================================"
          echo "NISULKA TOOLS"
          echo "======================================"

          echo ""

          echo "Python version:"
          python3 --version

          echo ""

          echo "Repository:"
          pwd

          echo ""

          echo "Tools:"
          ls -la tools || true

          echo ""

          echo "SEO:"
          ls -la seo || true


      # =====================================================
      # RUN AUDITOR
      # =====================================================

      - name: Run SEO auditor
        run: |

          echo "======================================"
          echo "RUNNING SEO AUDITOR"
          echo "======================================"

          python3 seo/seo_auditor.py


      # =====================================================
      # VERIFY JSON
      # =====================================================

      - name: Verify SEO report
        run: |

          echo "======================================"
          echo "VERIFYING SEO REPORT"
          echo "======================================"

          if [ ! -f "data/seo-audit.json" ]; then

            echo ""
            echo "ERROR:"
            echo "data/seo-audit.json was NOT created."
            echo ""

            echo "Data directory:"
            ls -la data || true

            exit 1

          fi


          echo ""

          echo "SEO report found:"
          ls -lh data/seo-audit.json


          echo ""

          echo "Validating JSON..."


          python3 - <<'PY'

          import json

          file_path = "data/seo-audit.json"

          with open(
              file_path,
              encoding="utf-8"
          ) as file:

              data = json.load(file)


          required = [
              "site",
              "site_url",
              "generated_at",
              "total_tools",
              "average_score",
              "tools"
          ]


          for key in required:

              if key not in data:

                  raise SystemExit(
                      f"Missing JSON field: {key}"
                  )


          print("JSON validation successful.")

          print(
              f"Total tools: "
              f"{data['total_tools']}"
          )

          print(
              f"Average score: "
              f"{data['average_score']}/100"
          )

          PY


      # =====================================================
      # CONSOLE SUMMARY
      # =====================================================

      - name: Display SEO summary
        run: |

          echo ""
          echo "======================================"
          echo "NISULKA TOOLS SEO AUDIT"
          echo "======================================"

          python3 - <<'PY'

          import json


          with open(
              "data/seo-audit.json",
              encoding="utf-8"
          ) as file:

              data = json.load(file)


          print()

          print(
              f"Total tools: "
              f"{data['total_tools']}"
          )

          print(
              f"Average SEO score: "
              f"{data['average_score']}/100"
          )

          print()

          print(
              "Tool rankings:"
          )

          print(
              "--------------------------------------"
          )


          for tool in data["tools"]:

              issues = len(
                  tool.get(
                      "recommendations",
                      []
                  )
              )


              print(
                  f"{tool['rank']}. "
                  f"{tool['name']} — "
                  f"{tool['score']}/100 "
                  f"({tool['grade']}) — "
                  f"{issues} issue(s)"
              )

          print()

          PY


      # =====================================================
      # GITHUB ACTIONS SUMMARY
      # =====================================================

      - name: Create GitHub Actions Summary
        run: |

          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"

          import json


          with open(
              "data/seo-audit.json",
              encoding="utf-8"
          ) as file:

              data = json.load(file)


          print("# 🔍 Nisulka Tools SEO Audit")
          print()


          print(
              f"## Average Score: "
              f"{data['average_score']}/100"
          )

          print()


          print(
              f"**Total Tools:** "
              f"{data['total_tools']}"
          )

          print()


          print(
              "| Rank | Tool | Score | Grade | Issues |"
          )

          print(
              "|---:|---|---:|:---:|---:|"
          )


          for tool in data["tools"]:

              issues = len(
                  tool.get(
                      "recommendations",
                      []
                  )
              )


              print(
                  f"| {tool['rank']} "
                  f"| {tool['name']} "
                  f"| {tool['score']}/100 "
                  f"| {tool['grade']} "
                  f"| {issues} |"
              )


          print()

          print(
              "## Recommendations"
          )

          print()


          found_recommendation = False


          for tool in data["tools"]:

              recommendations = tool.get(
                  "recommendations",
                  []
              )


              if not recommendations:

                  continue


              found_recommendation = True


              print(
                  f"### {tool['name']}"
              )

              print()


              for recommendation in recommendations:

                  print(
                      f"- ⚠️ {recommendation}"
                  )

              print()


          if not found_recommendation:

              print(
                  "🎉 All audited tools passed "
                  "the current SEO checks."
              )

          PY


      # =====================================================
      # CHECK CHANGES
      # =====================================================

      - name: Check for changes
        id: changes
        run: |

          if git diff --quiet -- data/seo-audit.json; then

            echo "changed=false" >> "$GITHUB_OUTPUT"

          else

            echo "changed=true" >> "$GITHUB_OUTPUT"

          fi


      # =====================================================
      # COMMIT
      # =====================================================

      - name: Commit SEO audit
        if: steps.changes.outputs.changed == 'true'

        run: |

          git config \
            user.name \
            "github-actions[bot]"


          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add data/seo-audit.json


          git commit \
            -m "chore: update SEO audit"


          git push


      # =====================================================
      # NO CHANGES
      # =====================================================

      - name: No audit changes
        if: steps.changes.outputs.changed == 'false'

        run: |

          echo "SEO audit data is already up to date."
