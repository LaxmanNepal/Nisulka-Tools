name: Nisulka Tools SEO Audit

on:
  push:
    branches:
      - main
    paths:
      - "tools/**"
      - "seo/**"
      - ".github/workflows/seo-audit.yml"

  workflow_dispatch:

  schedule:
    - cron: "30 2 * * 1"

permissions:
  contents: write

jobs:

  seo-audit:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run SEO auditor
        run: |
          python3 seo/seo_auditor.py

      - name: Display SEO summary
        run: |

          echo "======================================"
          echo "NISULKA TOOLS SEO AUDIT"
          echo "======================================"

          python3 <<'PY'

          import json

          with open(
              "data/seo-audit.json",
              encoding="utf-8"
          ) as f:

              data = json.load(f)

          print(
              f"Total tools: {data['totalTools']}"
          )

          print(
              f"Average SEO score: "
              f"{data['averageScore']}/100"
          )

          print()

          print(
              "Tool rankings:"
          )

          print(
              "--------------------------------------"
          )

          for index, tool in enumerate(
              data["tools"],
              start=1
          ):

              print(
                  f"{index}. "
                  f"{tool['name']} — "
                  f"{tool['score']}/100 "
                  f"({tool['grade']})"
              )

          PY

      - name: Create job summary
        run: |

          python3 <<'PY' >> "$GITHUB_STEP_SUMMARY"

          import json

          with open(
              "data/seo-audit.json",
              encoding="utf-8"
          ) as f:

              data = json.load(f)

          print("# Nisulka Tools SEO Audit")
          print()

          print(
              f"**Average SEO Score:** "
              f"{data['averageScore']}/100"
          )

          print()

          print(
              f"**Total Tools:** "
              f"{data['totalTools']}"
          )

          print()

          print(
              "| # | Tool | Score | Grade | Issues |"
          )

          print(
              "|---:|---|---:|:---:|---:|"
          )

          for index, tool in enumerate(
              data["tools"],
              start=1
          ):

              issues =
                  tool["issueSummary"]["total"]

              print(
                  f"| {index} "
                  f"| {tool['name']} "
                  f"| {tool['score']}/100 "
                  f"| {tool['grade']} "
                  f"| {issues} |"
              )

          PY

      - name: Check for changes
        id: changes
        run: |

          if git diff --quiet -- data/seo-audit.json; then

            echo "changed=false" \
              >> "$GITHUB_OUTPUT"

          else

            echo "changed=true" \
              >> "$GITHUB_OUTPUT"

          fi

      - name: Commit SEO audit
        if: steps.changes.outputs.changed == 'true'
        run: |

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/seo-audit.json

          git commit \
            -m "chore: update SEO audit"

          git push

      - name: No audit changes
        if: steps.changes.outputs.changed == 'false'
        run: |

          echo "SEO audit data is already up to date."
