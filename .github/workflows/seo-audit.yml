name: Nisulka Tools SEO Audit

on:

  push:
    branches:
      - main

    paths:
      - "tools/**"
      - "seo/**"
      - ".github/workflows/seo-audit.yml"

  workflow_dispatch:

  schedule:
    - cron: "30 2 * * 1"

permissions:
  contents: write


jobs:

  seo-audit:

    runs-on: ubuntu-latest


    steps:

      # =========================================
      # CHECKOUT
      # =========================================

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0


      # =========================================
      # PYTHON
      # =========================================

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"


      # =========================================
      # RUN AUDITOR
      # =========================================

      - name: Run SEO auditor
        run: |

          python3 seo/seo_auditor.py


      # =========================================
      # VERIFY OUTPUT
      # =========================================

      - name: Verify SEO audit
        run: |

          if [ ! -f "data/seo-audit.json" ]; then

            echo "ERROR:"
            echo "data/seo-audit.json was not generated."

            exit 1

          fi

          echo "SEO audit generated successfully."


      # =========================================
      # GITHUB SUMMARY
      # =========================================

      - name: Create GitHub Summary
        run: |

          python3 <<'PY' >> "$GITHUB_STEP_SUMMARY"

          import json

          with open(
              "data/seo-audit.json",
              encoding="utf-8"
          ) as f:

              data = json.load(f)


          print("# 🔍 Nisulka Tools SEO Audit")
          print()

          print(
              f"**Average SEO Score:** "
              f"**{data['averageScore']}/100**"
          )

          print()

          print(
              f"**Total Tools:** "
              f"{data['totalTools']}"
          )

          print()

          print(
              "| Rank | Tool | Score | Grade | Issues |"
          )

          print(
              "|---:|---|---:|:---:|---:|"
          )


          for tool in data["tools"]:

              issues = (
                  tool
                  .get("issueSummary", {})
                  .get("total", 0)
              )


              print(
                  f"| {tool['rank']} "
                  f"| {tool['name']} "
                  f"| {tool['score']}/100 "
                  f"| {tool['grade']} "
                  f"| {issues} |"
              )

          PY


      # =========================================
      # CHECK CHANGES
      # =========================================

      - name: Check for changes
        id: changes
        run: |

          if git diff --quiet -- data/seo-audit.json; then

            echo "changed=false" >> "$GITHUB_OUTPUT"

          else

            echo "changed=true" >> "$GITHUB_OUTPUT"

          fi


      # =========================================
      # COMMIT AUDIT
      # =========================================

      - name: Commit SEO audit
        if:
          steps.changes.outputs.changed == 'true'

        run: |

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add data/seo-audit.json


          git commit \
            -m "chore: update SEO audit"


          git push


      # =========================================
      # FINISH
      # =========================================

      - name: Audit complete
        run: |

          echo "======================================"
          echo "NISULKA TOOLS SEO AUDIT COMPLETE"
          echo "======================================"

          python3 <<'PY'

          import json

          with open(
              "data/seo-audit.json",
              encoding="utf-8"
          ) as f:

              data = json.load(f)


          print(
              "Average:",
              data["averageScore"]
          )

          print(
              "Tools:",
              data["totalTools"]
          )

          PY
