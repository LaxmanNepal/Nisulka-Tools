name: SEO Audit

on:
  push:
    branches:
      - main
    paths:
      - "tools/**"
      - "seo/**"
      - ".github/workflows/seo-audit.yml"

  pull_request:
    paths:
      - "tools/**"
      - "seo/**"
      - ".github/workflows/seo-audit.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  seo-audit:

    runs-on: ubuntu-latest

    steps:

      # ============================================
      # 1. Checkout repository
      # ============================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================
      # 2. Setup Python
      # ============================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # ============================================
      # 3. Run SEO auditor
      # ============================================

      - name: Run SEO audit
        run: |
          python3 seo/seo-auditor.py

      # ============================================
      # 4. Show reports
      # ============================================

      - name: Show SEO results
        run: |
          echo "========================================"
          echo "NISULKA TOOLS SEO AUDIT"
          echo "========================================"

          if [ -f seo/reports/seo-results.json ]; then
            python3 - <<'PY'
          import json

          with open(
              "seo/reports/seo-results.json",
              "r",
              encoding="utf-8"
          ) as f:
              results = json.load(f)

          print()

          for result in sorted(
              results,
              key=lambda x: x["score"]
          ):
              print(
                  f"{result['score']:>3}/100 "
                  f"{result['status']} "
                  f"{result['slug']}"
              )

          print()

          if results:
              average = round(
                  sum(
                      r["score"]
                      for r in results
                  ) / len(results)
              )

              print(
                  f"Average Score: {average}/100"
              )
          PY
          fi

      # ============================================
      # 5. Commit reports
      # ============================================

      - name: Commit SEO reports
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add seo/reports/

          if git diff --cached --quiet; then

            echo "No SEO report changes."

          else

            git commit \
              -m "chore: update SEO audit reports"

            git push

          fi
