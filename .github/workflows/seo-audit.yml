name: Nisulka Tools SEO Audit

on:
  push:
    branches:
      - main
    paths:
      - "tools/**"
      - "seo/**"
      - ".github/workflows/seo-audit.yml"

  workflow_dispatch:

  schedule:
    - cron: "30 2 * * 1"

permissions:
  contents: write

jobs:

  seo-audit:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Setup Python
      # ==========================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ==========================================
      # 3. Run SEO Auditor
      # ==========================================

      - name: Run SEO auditor
        run: |
          echo "======================================"
          echo "RUNNING NISULKA TOOLS SEO AUDITOR"
          echo "======================================"

          python3 seo/seo_auditor.py


      # ==========================================
      # 4. Verify Audit File
      # ==========================================

      - name: Verify SEO audit
        run: |

          if [ ! -f "data/seo-audit.json" ]; then

            echo "ERROR:"
            echo "data/seo-audit.json was not generated."

            echo ""
            echo "Files inside data/:"

            ls -la data || true

            exit 1

          fi

          echo "SEO audit file successfully generated."

          echo ""
          echo "File:"
          ls -lh data/seo-audit.json


      # ==========================================
      # 5. Display Console Summary
      # ==========================================

      - name: Display SEO summary
        run: |

          echo "======================================"
          echo "NISULKA TOOLS SEO AUDIT"
          echo "======================================"

          python3 <<'PY'

          import json

          with open(
              "data/seo-audit.json",
              encoding="utf-8"
          ) as f:

              data = json.load(f)


          print(
              f"Total tools: "
              f"{data['total_tools']}"
          )


          print(
              f"Average SEO score: "
              f"{data['average_score']}/100"
          )


          print()
          print("Tool rankings:")
          print("--------------------------------------")


          for index, tool in enumerate(
              data["tools"],
              start=1
          ):

              issues = len(
                  tool.get(
                      "recommendations",
                      []
                  )
              )


              print(
                  f"{index}. "
                  f"{tool['name']} — "
                  f"{tool['score']}/100 "
                  f"({tool['grade']}) — "
                  f"{issues} issue(s)"
              )

          PY


      # ==========================================
      # 6. GitHub Actions Summary
      # ==========================================

      - name: Create job summary
        run: |

          python3 <<'PY' >> "$GITHUB_STEP_SUMMARY"

          import json


          with open(
              "data/seo-audit.json",
              encoding="utf-8"
          ) as f:

              data = json.load(f)


          print("# 🔍 Nisulka Tools SEO Audit")
          print()


          print(
              f"### Average SEO Score: "
              f"**{data['average_score']}/100**"
          )

          print()


          print(
              f"**Total Tools:** "
              f"{data['total_tools']}"
          )

          print()


          print(
              "| Rank | Tool | Score | Grade | Issues |"
          )

          print(
              "|---:|---|---:|:---:|---:|"
          )


          for index, tool in enumerate(
              data["tools"],
              start=1
          ):

              issues = len(
                  tool.get(
                      "recommendations",
                      []
                  )
              )


              print(
                  f"| {index} "
                  f"| {tool['name']} "
                  f"| {tool['score']}/100 "
                  f"| {tool['grade']} "
                  f"| {issues} |"
              )


          print()
          print("---")
          print()
          print(
              "## Recommendations"
          )

          print()


          for tool in data["tools"]:

              recommendations = tool.get(
                  "recommendations",
                  []
              )


              if not recommendations:
                  continue


              print(
                  f"### {tool['name']}"
              )

              print()


              for recommendation in recommendations:

                  print(
                      f"- ⚠️ {recommendation}"
                  )

              print()

          PY


      # ==========================================
      # 7. Check for Changes
      # ==========================================

      - name: Check for changes
        id: changes
        run: |

          if git diff --quiet -- data/seo-audit.json; then

            echo "changed=false" \
              >> "$GITHUB_OUTPUT"

          else

            echo "changed=true" \
              >> "$GITHUB_OUTPUT"

          fi


      # ==========================================
      # 8. Commit SEO Audit
      # ==========================================

      - name: Commit SEO audit
        if: steps.changes.outputs.changed == 'true'
        run: |

          git config \
            user.name \
            "github-actions[bot]"


          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add data/seo-audit.json


          git commit \
            -m "chore: update SEO audit"


          git push


      # ==========================================
      # 9. No Changes
      # ==========================================

      - name: No audit changes
        if: steps.changes.outputs.changed == 'false'
        run: |

          echo "SEO audit data is already up to date."
