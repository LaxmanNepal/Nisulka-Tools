name: Nisulka Tools SEO Audit

on:
  push:
    branches:
      - main
    paths:
      - "tools/**"
      - "seo/**"
      - ".github/workflows/seo-audit.yml"

  workflow_dispatch:

  schedule:
    - cron: "30 2 * * 1"

permissions:
  contents: write

jobs:

  seo-audit:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Run SEO auditor
        run: |
          echo "Running Nisulka Tools SEO Auditor..."

          python3 seo/seo_auditor.py

          echo ""
          echo "Checking generated file..."

          if [ ! -f "data/seo-audit.json" ]; then
            echo "ERROR: data/seo-audit.json was not created."
            exit 1
          fi

          echo "SEO audit JSON successfully created."

      - name: Display SEO summary
        run: |

          python3 <<'PY'

          import json

          with open(
              "data/seo-audit.json",
              encoding="utf-8"
          ) as f:

              data = json.load(f)

          print("")
          print("=" * 60)
          print("NISULKA TOOLS SEO AUDIT")
          print("=" * 60)

          print(
              f"Total tools: {data['totalTools']}"
          )

          print(
              f"Average SEO score: "
              f"{data['averageScore']}/100"
          )

          print("")
          print("Tool rankings:")
          print("-" * 60)

          for tool in data["tools"]:

              print(
                  f"{tool['rank']}. "
                  f"{tool['name']} — "
                  f"{tool['score']}/100 "
                  f"({tool['grade']})"
              )

          print("=" * 60)

          PY

      - name: Create GitHub Actions Summary
        run: |

          python3 <<'PY' >> "$GITHUB_STEP_SUMMARY"

          import json

          with open(
              "data/seo-audit.json",
              encoding="utf-8"
          ) as f:

              data = json.load(f)

          print("# 🔍 Nisulka Tools SEO Audit")
          print("")

          print(
              f"### Average SEO Score: "
              f"**{data['averageScore']}/100**"
          )

          print("")

          print(
              f"**Total Tools:** "
              f"{data['totalTools']}"
          )

          print("")

          print(
              "| Rank | Tool | Score | Grade | Issues |"
          )

          print(
              "|---:|---|---:|:---:|---:|"
          )

          for tool in data["tools"]:

              issues = tool[
                  "issueSummary"
              ]["total"]

              print(
                  f"| {tool['rank']} "
                  f"| {tool['name']} "
                  f"| {tool['score']}/100 "
                  f"| {tool['grade']} "
                  f"| {issues} |"
              )

          print("")
          print("---")
          print("")
          print(
              "Generated automatically by "
              "Nisulka Tools SEO Auditor."
          )

          PY

      - name: Check for SEO audit changes
        id: changes
        run: |

          if git diff --quiet -- data/seo-audit.json; then

            echo "changed=false" >> "$GITHUB_OUTPUT"

          else

            echo "changed=true" >> "$GITHUB_OUTPUT"

          fi

      - name: Commit SEO audit
        if: steps.changes.outputs.changed == 'true'
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/seo-audit.json

          git commit \
            -m "chore: update SEO audit"

          git push

      - name: No SEO audit changes
        if: steps.changes.outputs.changed == 'false'
        run: |

          echo "SEO audit data is already up to date."
