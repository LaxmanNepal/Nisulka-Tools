name: Nisulka SEO Quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 2 * * 1'
jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate tool catalogue
        run: python scripts/validate-tools.py
      - name: Generate SEO coverage
        run: python scripts/generate-seo-report.py
      - name: Generate technical SEO audit
        run: python scripts/seo-audit.py
      - name: Generate SEO intelligence
        run: python scripts/seo-intelligence.py
      - name: Generate broken-link and orphan-page audit
        run: python scripts/seo-link-audit.py
      - name: Generate category entry pages
        run: python scripts/generate-category-pages.py
      - name: Generate canonical sitemap
        run: python scripts/generate-sitemap.py
      - name: SEO summary
        run: |
          python - <<'PY'
          import json
          r=json.load(open('reports/seo-coverage.json')); i=json.load(open('reports/seo-intelligence.json')); l=json.load(open('reports/seo-links.json'))
          print(f"Tools: {r['tool_count']}"); print(f"Average SEO score: {i['average_score']}%"); print(f"Critical: {i['critical']} | High: {i['high']} | Medium: {i['medium']} | Good: {i['good']}"); print(f"Broken links: {l['broken_count']} | Orphans: {l['orphan_count']}")
          PY
      - name: Write GitHub Step Summary
        run: |
          python - <<'PY'
          import json
          r=json.load(open('reports/seo-coverage.json')); i=json.load(open('reports/seo-intelligence.json')); l=json.load(open('reports/seo-links.json'))
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'],'a') as f:
            f.write(f"## Nisulka SEO Health\n\n| Metric | Value |\n|---|---:|\n| Tools | {i['tool_count']} |\n| Average SEO score | {i['average_score']}% |\n| Critical | {i['critical']} |\n| High | {i['high']} |\n| Medium | {i['medium']} |\n| Good | {i['good']} |\n| Broken links | {l['broken_count']} |\n| Orphan pages | {l['orphan_count']} |\n")
          PY
      - name: Fail on critical SEO regressions
        run: |
          python - <<'PY'
          import json,sys
          r=json.load(open('reports/seo-coverage.json')); a=json.load(open('reports/seo-audit.json')); l=json.load(open('reports/seo-links.json')); i=json.load(open('reports/seo-intelligence.json'))
          if r['duplicate_slugs'] or r['duplicate_urls']: print('Duplicate slugs or URLs detected');sys.exit(1)
          if r['seo_coverage'] < 80: print('SEO metadata coverage below 80%');sys.exit(1)
          critical=[x for x in a['issues'] if 'missing URL' in x or x.startswith('duplicate')]
          if critical: print('\n'.join(critical));sys.exit(1)
          if l['broken_count']: print('Broken internal links detected');sys.exit(1)
          PY
