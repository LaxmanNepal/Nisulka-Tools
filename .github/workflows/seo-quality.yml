name: Nisulka SEO Quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 2 * * 1'
jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate tool catalogue
        run: python scripts/validate-tools.py
      - name: Generate SEO coverage
        run: python scripts/generate-seo-report.py
      - name: Generate technical SEO audit
        run: python scripts/seo-audit.py
      - name: Generate SEO intelligence
        run: python scripts/seo-intelligence.py
      - name: Generate prioritized action plan
        run: python scripts/seo-action-plan.py
      - name: Generate broken-link and orphan-page audit
        run: python scripts/seo-link-audit.py
      - name: Generate category entry pages
        run: python scripts/generate-category-pages.py
      - name: Generate canonical sitemap
        run: python scripts/generate-sitemap.py
      - name: Write GitHub SEO Summary
        run: |
          python - <<'PY'
          import json,os
          i=json.load(open('reports/seo-intelligence.json')); a=json.load(open('reports/seo-action-plan.json')); l=json.load(open('reports/seo-links.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
            f.write(f"## Nisulka SEO Health\n\n| Metric | Value |\n|---|---:|\n| Tools | {i['tool_count']} |\n| Average score | {i['average_score']}% |\n| Critical tools | {i['critical']} |\n| High tools | {i['high']} |\n| Medium tools | {i['medium']} |\n| Good tools | {i['good']} |\n| Critical actions | {a['critical']} |\n| High actions | {a['high']} |\n| Broken links | {l['broken_count']} |\n| Orphan pages | {l['orphan_count']} |\n\n### Top actions\n")
            for x in a['actions'][:10]: f.write(f"- **{x['tool']}** ({x['score']}/100): {x['reason']}\n")
          PY
      - name: Fail on critical SEO regressions
        run: |
          python - <<'PY'
          import json,sys
          r=json.load(open('reports/seo-coverage.json')); a=json.load(open('reports/seo-audit.json')); l=json.load(open('reports/seo-links.json'))
          if r['duplicate_slugs'] or r['duplicate_urls']: print('Duplicate slugs or URLs detected');sys.exit(1)
          if r['seo_coverage'] < 80: print('SEO metadata coverage below 80%');sys.exit(1)
          critical=[x for x in a['issues'] if 'missing URL' in x or x.startswith('duplicate')]
          if critical: print('\n'.join(critical));sys.exit(1)
          if l['broken_count']: print('Broken internal links detected');sys.exit(1)
          PY
