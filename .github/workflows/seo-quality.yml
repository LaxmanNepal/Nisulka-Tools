name: Nisulka SEO Quality
on:
  push:
    branches: [main]
    paths-ignore:
      - 'reports/**'
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 2 * * 1'
permissions:
  contents: write
jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Platform integrity audit
        run: python scripts/platform-audit.py
      - name: Generate SEO reports
        run: |
          python scripts/validate-tools.py
          python scripts/generate-seo-report.py
          python scripts/seo-audit.py
          python scripts/seo-intelligence.py
          python scripts/seo-action-plan.py
          python scripts/seo-opportunity-engine.py
          python scripts/seo-link-audit.py
          python scripts/seo-history.py
          python scripts/seo-change-report.py
          python scripts/generate-category-pages.py
          python scripts/generate-sitemap.py
      - name: Write GitHub SEO Summary
        run: |
          python - <<'PY'
          import json,os
          i=json.load(open('reports/seo-intelligence.json')); a=json.load(open('reports/seo-action-plan.json')); o=json.load(open('reports/seo-opportunities.json')); l=json.load(open('reports/seo-links.json')); c=json.load(open('reports/seo-change.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
            f.write(f"## Nisulka SEO Health\n\n| Metric | Value |\n|---|---:|\n| Average score | {i['average_score']}% |\n| Score change | {c['score_change']:+} |\n| Tools | {i['tool_count']} |\n| Critical | {i['critical']} |\n| High | {i['high']} |\n| Actions | {a['total_actions']} |\n| Opportunities | {o['counts']['opportunities']} |\n| Broken links | {l['broken_count']} |\n| Orphans | {l['orphan_count']} |\n\n### Improved tools\n")
            for x in c['improved'][:10]: f.write(f"- **{x['name']}** {x['from']} → {x['to']} (+{x['change']})\n")
            f.write("\n### Regressed tools\n")
            for x in c['regressed'][:10]: f.write(f"- **{x['name']}** {x['from']} → {x['to']} ({x['change']})\n")
            f.write("\n### Top actions\n")
            for x in a['actions'][:10]: f.write(f"- **{x['tool']}** ({x['score']}/100): {x['reason']}\n")
          PY
      - name: Persist generated SEO state
        if: github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/
          if git diff --cached --quiet; then echo 'No SEO state changes to commit.'; else git commit -m 'chore: update generated SEO reports'; git push; fi
      - name: Upload SEO reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nisulka-seo-report-${{ github.run_number }}
          path: reports/
          retention-days: 90
      - name: Fail on critical regressions
        run: |
          python - <<'PY'
          import json,sys
          r=json.load(open('reports/seo-coverage.json')); a=json.load(open('reports/seo-audit.json')); l=json.load(open('reports/seo-links.json')); c=json.load(open('reports/seo-change.json'))
          if r['duplicate_slugs'] or r['duplicate_urls']: sys.exit('Duplicate slugs or URLs detected')
          if r['seo_coverage'] < 80: sys.exit('SEO metadata coverage below 80%')
          critical=[x for x in a['issues'] if 'missing URL' in x or x.startswith('duplicate')]
          if critical: sys.exit('\n'.join(critical))
          if l['broken_count']: sys.exit('Broken internal links detected')
          if c['score_change'] <= -5: sys.exit('SEO score dropped by 5+ points')
          if any(x['change']<=-10 for x in c['regressed']): sys.exit('A tool SEO score dropped by 10+ points')
          if c.get('new_broken_links',0)>0 or c.get('new_orphans',0)>0: sys.exit('New technical SEO regressions detected')
          PY
