<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tool Categories — Free Online Tools | Nisulka Tools</title><meta name="description" content="Explore all Nisulka Tools categories. Find free online tools for images, PDF, video, text, AI and more."><meta name="robots" content="index,follow,max-image-preview:large"><link rel="canonical" href="https://apps.laxmannepal.com.np/Nisulka-Tools/categories/"><link rel="manifest" href="../manifest.webmanifest"><link rel="icon" href="../assets/icons/icon.svg" type="image/svg+xml"><meta name="theme-color" content="#007aff"><link rel="stylesheet" href="../assets/css/variables.css"><link rel="stylesheet" href="../assets/css/global.css"><link rel="stylesheet" href="../assets/css/components.css"><link rel="stylesheet" href="../assets/css/header.css"><link rel="stylesheet" href="../assets/css/footer.css"><link rel="stylesheet" href="../assets/css/home.css"><link rel="stylesheet" href="../assets/css/category-page.css"><script type="application/ld+json" id="category-schema"></script></head><body><div id="site-header-mount"></div><main><section class="home-hero category-hero"><div class="home-container"><span class="hero-eyebrow">NISULKA TOOLS</span><h1>Explore Tool Categories</h1><p>Browse every collection and find the right free online tool faster.</p><label class="category-search"><span class="sr-only">Search categories</span><input id="category-hub-search" type="search" placeholder="Search categories…" autocomplete="off"></label></div></section><section class="tools-section"><div class="home-container"><nav aria-label="Breadcrumb" class="category-breadcrumb"><a href="../">Nisulka Tools</a><span aria-hidden="true">›</span><span>Categories</span></nav><div id="categories-grid" class="categories-grid" aria-live="polite"></div><p id="category-hub-empty" class="category-empty" hidden>No matching categories found.</p></div></section></main><div id="site-footer-mount"></div><script src="../assets/js/nisulka-tool-core.js"></script><script src="../assets/js/header.js"></script><script src="../assets/js/footer.js"></script><script>(function(){'use strict';const grid=document.getElementById('categories-grid'),input=document.getElementById('category-hub-search'),empty=document.getElementById('category-hub-empty');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const slug=v=>String(v).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'other-tools';async function init(){try{const r=await fetch('../data/tools.json',{cache:'no-cache'});if(!r.ok)throw Error('catalog');const raw=await r.json(),tools=Array.isArray(raw)?raw:JSON.parse(raw.content||'[]'),map=new Map();tools.filter(t=>t.status!=='hidden').forEach(t=>{const name=t.category||'Other Tools',s=t.categorySlug||slug(name);if(!map.has(s))map.set(s,{name,slug:s,count:0});map.get(s).count++});const categories=[...map.values()].sort((a,b)=>a.name.localeCompare(b.name)),icons=['✦','◈','◉','✧','⬡','◌','✳','◇'];grid.innerHTML=categories.map((c,i)=>`<a class="category-card" href="${esc(c.slug)}.html" data-name="${esc(c.name.toLowerCase())}"><div class="category-icon" aria-hidden="true">${icons[i%icons.length]}</div><h2>${esc(c.name)}</h2><p>Free online ${esc(c.name.toLowerCase())} tools.</p><span class="category-count">${c.count} ${c.count===1?'tool':'tools'}</span></a>`).join('');document.getElementById('category-schema').textContent=JSON.stringify({'@context':'https://schema.org','@type':'CollectionPage','name':'Tool Categories — Nisulka Tools','url':'https://apps.laxmannepal.com.np/Nisulka-Tools/categories/','mainEntity':{'@type':'ItemList','numberOfItems':categories.length,'itemListElement':categories.map((c,i)=>({'@type':'ListItem','position':i+1,'name':c.name,'url':'https://apps.laxmannepal.com.np/Nisulka-Tools/categories/'+c.slug+'.html}))}});input.addEventListener('input',()=>{const q=input.value.trim().toLowerCase();let n=0;grid.querySelectorAll('.category-card').forEach(c=>{const show=c.dataset.name.includes(q);c.hidden=!show;if(show)n++});empty.hidden=n!==0})}catch(e){grid.innerHTML='<p class="category-empty">Categories are temporarily unavailable.</p>'}}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init()})();</script></body></html>
