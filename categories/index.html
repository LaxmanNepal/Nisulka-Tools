<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tool Categories — Free Online Tools | Nisulka Tools</title><meta name="description" content="Explore all Nisulka Tools categories. Find free online tools for images, PDF, video, text, AI and more."><meta name="robots" content="index,follow,max-image-preview:large"><link rel="canonical" href="https://apps.laxmannepal.com.np/Nisulka-Tools/categories/"><link rel="stylesheet" href="../assets/css/variables.css"><link rel="stylesheet" href="../assets/css/global.css"><link rel="stylesheet" href="../assets/css/components.css"><link rel="stylesheet" href="../assets/css/home.css"><link rel="stylesheet" href="../assets/css/category-page.css"><style>.categories-hero{padding:56px 0 28px}.categories-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}.category-card{display:block;padding:24px;border:1px solid var(--border-color);border-radius:22px;background:var(--bg-surface);box-shadow:var(--shadow-sm);transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}.category-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:var(--brand-primary)}.category-icon{width:58px;height:58px;border-radius:17px;display:grid;place-items:center;background:color-mix(in srgb,var(--brand-primary) 12%,transparent);font-size:1.65rem;margin-bottom:16px}.category-card h2{margin:0 0 7px}.category-card p{margin:0;color:var(--text-secondary)}.category-count{display:inline-flex;margin-top:16px;padding:5px 9px;border-radius:999px;background:var(--bg-surface-secondary);font-size:.82rem;font-weight:600}.category-hub-search{width:100%;max-width:520px;margin:22px auto 0;display:block;padding:14px 17px;border:1px solid var(--border-color);border-radius:15px;background:var(--bg-surface);color:var(--text-primary);font:inherit;outline:0}.category-hub-search:focus{border-color:var(--brand-primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand-primary) 12%,transparent)}.category-hub-empty{text-align:center;color:var(--text-secondary);padding:40px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:600px){.categories-grid{grid-template-columns:1fr}.categories-hero{padding-top:35px}}</style><script type="application/ld+json" id="category-schema"></script></head><body><div id="site-header-mount"></div><main><section class="home-hero categories-hero"><div class="home-container"><span class="hero-eyebrow">NISULKA TOOLS</span><h1>Explore Tool Categories</h1><p>Browse every collection and find the right free online tool faster.</p><label><span class="sr-only">Search categories</span><input id="category-hub-search" class="category-hub-search" type="search" placeholder="Search categories…" autocomplete="off"></label></div></section><section class="tools-section"><div class="home-container"><nav aria-label="Breadcrumb" class="category-breadcrumb"><a href="../">Nisulka Tools</a><span aria-hidden="true">›</span><span>Categories</span></nav><div id="categories-grid" class="categories-grid" aria-live="polite"></div><p id="category-hub-empty" class="category-hub-empty" hidden>No matching categories found.</p></div></section></main><div id="site-footer-mount"></div><script src="../assets/js/nisulka-tool-core.js"></script><script src="../assets/js/header.js"></script><script src="../assets/js/footer.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{const grid=document.getElementById('categories-grid'),input=document.getElementById('category-hub-search'),empty=document.getElementById('category-hub-empty');try{const r=await fetch('../data/tools.json',{cache:'no-cache'});if(!r.ok)throw Error();const raw=await r.json(),tools=Array.isArray(raw)?raw:JSON.parse(raw.content||'[]'),map=new Map();tools.filter(t=>t.status!=='hidden').forEach(t=>{const name=t.category||'Other Tools',slug=t.categorySlug||name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'other-tools';if(!map.has(slug))map.set(slug,{name,slug,count:0});map.get(slug).count++});const categories=[...map.values()].sort((a,b)=>a.name.localeCompare(b.name));const icons=['✦','◈','◉','◇','✧','⬡','◌','✳'];grid.innerHTML=categories.map((c,i)=>`<a class="category-card" href="${c.slug}.html" data-name="${c.name.toLowerCase()}"><div class="category-icon" aria-hidden="true">${icons[i%icons.length]}</div><h2>${escapeHtml(c.name)}</h2><p>Free online ${escapeHtml(c.name.toLowerCase())} tools.</p><span class="category-count">${c.count} ${c.count===1?'tool':'tools'}</span></a>`).join('');document.getElementById('category-schema').textContent=JSON.stringify({'@context':'https://schema.org','@type':'CollectionPage','name':'Tool Categories — Nisulka Tools','url':location.href,'mainEntity':{'@type':'ItemList','numberOfItems':categories.length,'itemListElement':categories.map((c,i)=>({'@type':'ListItem','position':i+1,'name':c.name,'url':location.origin+location.pathname+c.slug+'.html'}))}});input.addEventListener('input',()=>{const q=input.value.trim().toLowerCase();let n=0;grid.querySelectorAll('.category-card').forEach(c=>{const show=c.dataset.name.includes(q);c.hidden=!show;if(show)n++});empty.hidden=n!==0})}catch(e){grid.innerHTML='<p class="category-hub-empty">Categories are temporarily unavailable.</p>'}});function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</script></body></html>
