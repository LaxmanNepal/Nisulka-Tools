<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>My Tools — Favorites & Recently Used | Nisulka Tools</title><meta name="description" content="Quickly access your favorite and recently used Nisulka Tools. Your data stays in this browser."><meta name="robots" content="noindex,follow"><link rel="canonical" href="https://apps.laxmannepal.com.np/Nisulka-Tools/my-tools/"><link rel="stylesheet" href="../assets/css/variables.css"><link rel="stylesheet" href="../assets/css/global.css"><link rel="stylesheet" href="../assets/css/components.css"><link rel="stylesheet" href="../assets/css/header.css"><link rel="stylesheet" href="../assets/css/footer.css"><link rel="stylesheet" href="../assets/css/tool-intelligence.css"><style>.my-hero{padding:52px 0 26px}.my-hero h1{margin:.2rem 0 .6rem}.my-hero p{color:var(--text-secondary)}.my-section{padding:22px 0 48px}.my-heading{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:18px}.my-heading h2{margin:0}.my-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}.my-card{position:relative;min-height:170px;padding:18px;border:1px solid var(--border-color);border-radius:20px;background:var(--bg-surface);box-shadow:var(--shadow-sm);transition:transform .18s ease,box-shadow .18s ease}.my-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}.my-card a{display:block;color:inherit;text-decoration:none}.my-logo{width:68px;height:68px;display:grid;place-items:center;margin-bottom:13px;border-radius:18px;background:var(--bg-surface-secondary);overflow:hidden}.my-logo img{width:100%;height:100%;object-fit:contain}.my-logo span{font-size:1.5rem}.my-card h3{margin:0;font-size:1rem}.my-card small{display:block;margin-top:5px;color:var(--text-muted)}.my-remove{position:absolute;right:10px;top:10px;width:30px;height:30px;border:1px solid var(--border-color);border-radius:10px;background:var(--bg-surface);color:var(--text-secondary);cursor:pointer}.my-empty{padding:30px;border:1px dashed var(--border-color);border-radius:20px;color:var(--text-secondary);text-align:center}.my-clear{border:0;background:transparent;color:var(--brand-primary);font:inherit;cursor:pointer}@media(max-width:600px){.my-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.my-card{min-height:155px;padding:14px}}@media(prefers-reduced-motion:reduce){.my-card{transition:none}}</style></head><body><div id="site-header-mount"></div><main><section class="home-hero my-hero"><div class="home-container"><span class="hero-eyebrow">YOUR WORKSPACE</span><h1>My Tools</h1><p>Favorites and recently used tools, saved privately in this browser.</p></div></section><section class="my-section"><div class="home-container"><div class="my-heading"><h2>⭐ Favorites</h2><button class="my-clear" id="clear-favorites" type="button">Clear all</button></div><div id="favorites" class="my-grid"></div></div></section><section class="my-section"><div class="home-container"><div class="my-heading"><h2>🕘 Recently Used</h2><button class="my-clear" id="clear-history" type="button">Clear history</button></div><div id="recent" class="my-grid"></div></div></section></main><div id="site-footer-mount"></div><script src="../assets/js/nisulka-tool-core.js"></script><script src="../assets/js/header.js"></script><script src="../assets/js/footer.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{let tools=[];try{const r=await fetch('../data/tools.json',{cache:'default'});const d=await r.json();tools=Array.isArray(d)?d:JSON.parse(d.content||'[]')}catch(e){}const bySlug=new Map(tools.map(t=>[String(t.slug||''),t]));const core=window.NisulkaTools||{};function fav(){return Array.isArray(core.favorites?.all?.())?core.favorites.all():[]}function recent(){return Array.isArray(core.history?.all?.())?core.history.all():[]}function card(t,remove,kind){if(!t)return'';const name=esc(t.name||'Tool'),url=esc(t.url||'#'),logo=t.logo?`<img src="${esc(t.logo)}" alt="" loading="lazy" width="68" height="68">`:'<span aria-hidden="true">✦</span>';return `<article class="my-card"><a href="${url}" data-tool-slug="${esc(t.slug||'')}"><div class="my-logo">${logo}</div><h3>${name}</h3><small>${esc(t.category||'Tool')}</small></a>${remove?`<button class="my-remove" type="button" data-remove="${esc(t.slug||'')}" data-kind="${kind}" aria-label="Remove ${name}">×</button>`:''}</article>`}function render(){const f=fav().map(s=>bySlug.get(String(s))).filter(Boolean),r=recent().map(x=>bySlug.get(String(x?.slug||x))).filter(Boolean);document.getElementById('favorites').innerHTML=f.length?f.map(t=>card(t,true,'fav')).join(''):'<div class="my-empty">No favorites yet.<br>Favorite a tool to save it here.</div>';document.getElementById('recent').innerHTML=r.length?r.map(t=>card(t,false,'recent')).join(''):'<div class="my-empty">No recently used tools yet.<br>Open a tool and it will appear here.</div>'}window.addEventListener('nisulka:favorites-changed',render);window.addEventListener('nisulka:history-changed',render);document.addEventListener('click',e=>{const b=e.target.closest('[data-remove]');if(!b)return;if(b.dataset.kind==='fav')core.favorites.toggle(b.dataset.remove);else{const arr=recent().filter(x=>String(x?.slug||'')!==String(b.dataset.remove));core.storage.set('history',arr)}render()});document.getElementById('clear-favorites').onclick=()=>{core.storage.remove('favorites');window.dispatchEvent(new CustomEvent('nisulka:favorites-changed'));render()};document.getElementById('clear-history').onclick=()=>{core.history.clear();render()};render();function esc(v){return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}});</script></body></html>
