<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SEO Command Center | Nisulka Tools</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="assets/css/variables.css"><link rel="stylesheet" href="assets/css/global.css"><style>main{max-width:1150px;margin:auto;padding:60px 20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.card{padding:18px;border:1px solid #ffffff80;border-radius:22px;background:#ffffff80;backdrop-filter:blur(18px);box-shadow:0 12px 40px #0000000b}.num{font-size:28px;font-weight:800}.item{margin:8px 0}.pill{display:inline-block;padding:4px 9px;border-radius:99px;background:#eee}.bad{color:#d92d20}.warn{color:#b54708}.good{color:#078a57}.muted{color:#667085}section{margin:28px 0}.history{display:flex;gap:8px;overflow:auto;align-items:end;height:150px}.bar{min-width:45px;text-align:center}.bar i{display:block;height:var(--h);min-height:4px;border-radius:8px;background:#999}.bar small{display:block;white-space:nowrap}@media(max-width:600px){main{padding:35px 14px}}</style></head><body><main><p>NISULKA TOOLS</p><h1>SEO Command Center</h1><p class="muted">Internal SEO monitoring. Excluded from search engines.</p><section><div class="grid" id="stats"></div></section><section class="card"><h2>SEO trend</h2><div class="history" id="history">Loading…</div></section><section><h2>Top opportunities</h2><div id="opps"></div></section><section><h2>Priority actions</h2><div id="actions"></div></section><section><h2>Technical health</h2><div id="tech"></div></section></main><script>Promise.all(['seo-intelligence.json','seo-action-plan.json','seo-opportunities.json','seo-links.json'].map(x=>fetch('reports/'+x,{cache:'no-store'}).then(r=>r.json()))).then(([i,a,o,l])=>{document.getElementById('stats').innerHTML=[['Average score',i.average_score+'%'],['Tools',i.tool_count],['Critical',i.critical],['High',i.high],['Opportunities',o.counts.opportunities],['Link opportunities',o.counts.link_targets],['Cannibalization',o.counts.cannibalization_risks],['Broken links',l.broken_count]].map(x=>`<div class="card"><span>${x[0]}</span><div class="num">${x[1]}</div></div>`).join('');document.getElementById('opps').innerHTML=o.opportunities.slice(0,10).map(x=>`<div class="card item"><b>${x.name}</b> · ${x.opportunity}/100<br><small>${x.reasons.join(' · ')||'Optimization opportunity'}</small></div>`).join('')||'<p>None detected.</p>';document.getElementById('actions').innerHTML=a.actions.slice(0,15).map(x=>`<div class="card item"><b>${x.tool}</b> · ${x.score}/100 · <span class="${x.priority==='critical'?'bad':'warn'}">${x.priority}</span><br>${x.reason}</div>`).join('')||'<p>All clear.</p>';document.getElementById('tech').innerHTML=`<div class="grid"><div class="card">Broken links<br><b class="${l.broken_count?'bad':'good'}">${l.broken_count}</b></div><div class="card">Orphan pages<br><b class="${l.orphan_count?'warn':'good'}">${l.orphan_count}</b></div><div class="card">External links<br><b>${l.external_links.length}</b></div></div>`;return fetch('reports/seo-history.json',{cache:'no-store'}).then(r=>r.json())}).then(h=>{let max=Math.max(100,...h.map(x=>x.average_score||0));document.getElementById('history').innerHTML=h.map(x=>`<div class="bar"><i style="--h:${Math.max(8,(x.average_score/max)*110)}px"></i><b>${x.average_score}%</b><small>${x.date.slice(5)}</small></div>`).join('')||'<p>No history yet.</p>'}).catch(e=>{document.body.innerHTML+='<p>Reports not generated yet.</p>'})</script></body></html>
