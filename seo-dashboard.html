<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SEO Health Dashboard | Nisulka Tools</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="assets/css/variables.css"><link rel="stylesheet" href="assets/css/global.css"><style>main{max-width:1100px;margin:auto;padding:70px 20px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}.stat,.row,.action{padding:18px;border:1px solid #ffffff80;border-radius:20px;background:#ffffff80;backdrop-filter:blur(18px)}.stat strong{display:block;font-size:30px}.row{display:grid;grid-template-columns:1fr 90px 90px;gap:12px;margin:8px 0}.action{margin:8px 0}.bad{color:#d92d20}.warn{color:#b54708}.good{color:#078a57}.muted{color:#667085}@media(max-width:600px){.row{grid-template-columns:1fr 70px}.row span:last-child{grid-column:1/-1}}</style></head><body><main><p>NISULKA TOOLS</p><h1>SEO Command Center</h1><p class="muted">Internal quality dashboard. This page is intentionally excluded from search engines.</p><section class="stats" id="stats"></section><h2>Top actions</h2><div id="actions"></div><h2>Priority queue</h2><div id="rows"></div></main><script>Promise.all([fetch('reports/seo-intelligence.json',{cache:'no-store'}).then(r=>r.json()),fetch('reports/seo-action-plan.json',{cache:'no-store'}).then(r=>r.json())]).then(([d,a])=>{document.getElementById('stats').innerHTML=[['Average score',d.average_score+'%'],['Tools',d.tool_count],['Critical',d.critical],['High',d.high],['Medium',d.medium],['Good',d.good],['Actions',a.total_actions]].map(x=>`<div class="stat"><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join('');document.getElementById('actions').innerHTML=a.actions.slice(0,12).map(x=>`<div class="action"><strong>${x.tool}</strong> · ${x.score}/100 · <span class="${x.priority==='critical'?'bad':'warn'}">${x.priority}</span><div>${x.reason}</div><small class="muted">Impact: ${x.impact} · ${x.type}</small></div>`).join('')||'<p>No actions.</p>';document.getElementById('rows').innerHTML=d.tools.filter(x=>x.priority!=='good').slice(0,50).map(x=>`<div class="row"><strong>${x.name}</strong><span>${x.score}/100</span><span class="${x.priority==='critical'?'bad':'warn'}">${x.priority}</span><small>Missing: ${x.missing.join(', ')||'none'}</small></div>`).join('')||'<p>All tools are in good shape.</p>'}).catch(()=>{document.getElementById('rows').textContent='Reports not generated yet. Run GitHub Actions.'})</script></body></html>
